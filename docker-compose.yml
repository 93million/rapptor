networks:
  default:
    name: rapptor

volumes:
  rapptor-user-data:
    name: rapptor-user-data
  rapptor-tls-certs:
    name: rapptor-tls-certs

services:
  rapptoros:
    container_name: service.rapptor.os
    image: ${RAPPTOR_CUSTOM_IMAGE_URI:-ghcr.io/rapptorvpn/rapptor:0.3.0}
    restart: always
    environment:
      NODE_ENV: production
      RAPPTOR_APP_STORE_REPO: ${RAPPTOR_CUSTOM_APP_STORE_REPO:-https://github.com/rapptorvpn/app-store/}
    env_file:
      - .env
    ports:
      - 80:80
      - 443:443
      - 4000:4000
      - 4002:4002
    volumes:
      - ./:/app/system:rw
      - ./.env:/app/.env:rw
      - ./apps:/app/apps:rw
      - ./appstore:/app/appstore:rw
      - ./accounts:/app/accounts:rw
      - ./base:/base:rw
      - ./docker/config.json:/app/docker/config.json:ro
      - ./var/token:/app/var/token:rw
      - ./var/data:/app/var/data:rw
      - /run/initctl:/run/initctl:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - rapptor-tls-certs:/etc/certcache:ro
      - rapptor-user-data:/files:rw
    labels:
      com.rapptor.containerType: system
  certcache:
    container_name: certcache
    image: ghcr.io/93million/certcache:1.0.0
    restart: always
    volumes:
      - ./certcache/cache/:/certcache/cache/:rw
      - ./certcache/catkeys/:/certcache/catkeys/:rw
      - ./certcache/conf/:/certcache/conf/:ro
      - rapptor-tls-certs:/certcache/certs/:rw
    env_file:
      - .env
    ports:
      - '53:53/udp'
      - '53:53/tcp'
    labels:
      com.rapptor.containerType: system
  docker-container:
    image: docker:26.1.0-dind-alpine3.19
    container_name: dockerrun
    restart: 'no'
    labels:
      com.rapptor.containerType: system
    command: ['true']
